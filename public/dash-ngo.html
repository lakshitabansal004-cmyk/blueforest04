    <script>
        let myModule = angular.module("moduleKuch", []);
        let myController = myModule.controller("controllerKuch", function ($scope, $http) {
            $scope.doShowAll = function () {
                //alert($scope.emailKuch);
                let url = "/fetch-all-med-manager?emailkeykuch=" + $scope.emailKuch;
                $http.get(url).then(function (resp) {
                    //alert(JSON.stringify(resp.data));
                    $scope.jsonAry = resp.data;
                }, function (err) {
                    alert(err);

                })
            }
            $scope.doShowAll2 = function () {
                //alert($scope.emailKuch);
                let url = "/fetch-all-eqp-manager?emailkeykuch=" + $scope.emailKuch;
                $http.get(url).then(function (resp) {
                    //alert(JSON.stringify(resp.data));
                    $scope.jsonAry = resp.data;
                }, function (err) {
                    alert(err);

                })
            }
            $scope.doDelete = function (ridKuch) {
                alert(ridKuch);
                let url = "/do-delete-med?ridkeykuch=" + ridKuch;
                $http.get(url).then(function (resp) {

                    $scope.doShowAll();
                }, function (err) {
                    alert(err);
                })
            }
            $("#showhidepwd").click(function () {
                if ($("#txtPwd").prop("type") == "password") {
                    $(this).removeClass("fa-eye-slash").addClass("fa-eye");
                    $("#txtPwd").prop("type", "text")

                }
                else {
                    $(this).removeClass("fa-eye").addClass("fa-eye-slash");
                    $("#txtPwd").prop("type", "password")

                }
            })
            $("#showhidepwd2").click(function () {
                if ($("#txtPwd2").prop("type") == "password") {

                else {

            $scope.doUpdate = function () {
                //alert("Email: " + $scope.emailKuch2);
                // alert("Password: " + $scope.newpass);
                // alert($scope.pass);
                let url = "/update-password?passkeykuch=" + $scope.newpass + "&emailkeyKuch2=" + $scope.emailKuch2 + "&passkeyKuch2=" + $scope.pass;
                $http.get(url).then(function (resp) {
                    alert(JSON.stringify(resp.data));
                    $scope.jsonAry = resp.data;
                }, function (err) {
                    alert(err);

                })
            }
        })
