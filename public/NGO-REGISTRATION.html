<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>NGO registration</title>
    <script>
        function doShowPrev(fileCtrl, prev) {
            if (fileCtrl.files && fileCtrl.files[0]) {
                prev.src = URL.createObjectURL(fileCtrl.files[0]);

            }
        }
    </script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>

<body>
    <div class="container border">
        <form action="/ngo-registration" class="" enctype="multipart/form-data" method="post">
            <div class="row">
                <div class="col-md-12 bg-warning text-white">
                    <center>
                        <b>
                            <p class="fs-2">NGO Registration</p>
                    </center>
                </div>
            </div>
            <div class="row">
                <div class="col-md-4">
                    <center>
                        <img id="prev" src="" width="300" height="400" style="margin-top:80px;">
                        <br><br>
                        <b>Registration Proof</b>
                        <br>

                        <input type="file" name="proofpic" id="proofpic" onchange="doShowPrev(this,prev)"
                            style="padding-left:150px ;">
                    </center>
                </div>
                <div class="col-md-8 mt-5">
                    <div class="row">
                        <div class="col-md-8">
                            <label for="inputEmail4" class="form-label">Email Id</label>
                            <input type="email" class="form-control" id="txtEmail" name="txtEmail">
                        </div>
                    </div>
                    <div class="row">
                        <div class="col-md-4">
                            <label class="form-label mt-3">NGO Name</label>
                            <input type="text" class="form-control" id="txtNGOName" name="txtNGOName">
                        </div>
                        <div class="col-md-4">
                            <label class="form-label mt-3">Registration Office</label>
                            <input type="text" class="form-control" id="txtregoffice" name="txtregoffice">
                        </div>
                        <div class="col-md-4">
                            <label class="form-label mt-3">City</label>
                            <input type="text" class="form-control" id="city" name="city">
                        </div>
                    </div>
                    <div class="row">
                        <div class="col-md-5">
                            <label class="form-label mt-3">Website</label>
                            <input type="text" class="form-control" id="web" name="web" value="NO WEBSITE">
                        </div>
                        <div class="col-md-3">
                            <label class="form-label mt-3">Contact Number</label>
                            <input type="number" class="form-control" id="mob" name="mob">
                        </div>
                        <div class="col-md-4">
                            <label class="form-label mt-3">Since</label>
                            <input type="number" class="form-control" id="since" name="since"  required min="1900"max="2100" >
                        </div>
                    </div>
                    <div class="row">
                        <div class="col-md-6">
                            <label class="form-label mt-3">Chair Person</label>
                            <input type="text" class="form-control" id="chairperson" name="chairperson">
                        </div>
                        <div class="col-md-5">
                            <label class="form-label mt-3">NGO Profile/Works</label>
                            <input type="text" class="form-control" id="prof" name="prof">
                        </div>
                    </div>
                    <div class="row">
                        <div class="col-md-8">
                            <label class="form-label mt-3">Registration Number</label>
                            <input type="text" class="form-control" id="regnumber" name="regnumber">
                        </div>
                    </div>
                    <div class="row">
                        <div class="col-md-12 mt-5">
                            <center>
                                <button type="submit" class="btn btn-primary">Register Now</button>
                            </center>

                        </div>
                    </div>
</body>
