<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Donor Profile</title>
    <script>
        function doShowPrev(fileCtrl, prev) {
            if (fileCtrl.files && fileCtrl.files[0]) {
                prev.src = URL.createObjectURL(fileCtrl.files[0]);

            }
        }
        function doShowPrev2(fileCtrl, prev2) {
            if (fileCtrl.files && fileCtrl.files[0]) {
                prev2.src = URL.createObjectURL(fileCtrl.files[0]);

            }
        }
    </script>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"
        integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo=" crossorigin="anonymous"></script>

    <script>
        function setemail() {
document.getElementById("txtEmail").value=localStorage.getItem("activeuser");
document.getElementById("txtEmail").readonly=true;
        }
    </script>

    <script>
        $(document).ready(function () {
            $("#btnFetchOne").click(function () {
                //alert()
                let obj = {
                    url: "/fetch-one",
                    data: {
                        emailKuch: $("#txtEmail").val()
                    }
                }
                $.ajax(obj).then(function (jsonAry) {
                    alert(JSON.stringify(jsonAry));
                    $("#prev").prop("src", jsonAry[0].acardpath);
                    $("#prev2").prop("src", jsonAry[0].picpath);
                    $("#txtName").val(jsonAry[0].name);
                    $("#mob").val(jsonAry[0].mobile);
                    $("#txtaddress").val(jsonAry[0].address);
                    $("#city").val(jsonAry[0].city);

                    $("#hdn").val(jsonAry[0].acardpath);
                    $("#hdn2").val(jsonAry[0].picpath);
                })
            })
        })
    </script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>

<body onload="setemail()">

    <div class="container border">
        <div class="row" style="background-color: rgb(0, 184, 80); color: white;">
            <div class="col-md-12">
                <center>
                    <b>
                        <p class="fs-2">DONOR PROFILE</p>
                </center>
            </div>
        </div>
        <form action="/donor" class="" enctype="multipart/form-data" method="post">
            <input type="hidden" id="hdn" name="hdn">
            <input type="hidden" id="hdn2" name="hdn2">
            <div class="row g-3 align-items-end">
                <div class="col-md-6">
                    <label for="inputEmail4" class="form-label">Email</label>
                    <input type="email" class="form-control" id="txtEmail" name="txtEmail">
                </div>
                <div class="col-md-2">
                    <input type="button" class="btn btn-primary" id="btnFetchOne" value="Get Profile Data">
                </div>
            </div>
            <div class="row mt-2">
                <div class="col-md-5">
                    <label for="inputAddress" class="form-label">Name</label>
                    <input type="text" class="form-control" id="txtName" name="txtName">
                </div>
                <div class="col-md-5">
                    <label for="inputCity" class="form-label">Mobile Number</label>
                    <input type="text" class="form-control" id="mob" name="mob">
                </div>
            </div>
            <div class="row mt-2">
                <div class="col-md-8">
                    <label for="inputAddress" class="form-label">Address</label>
                    <input type="text" class="form-control" id="txtaddress" name="txtaddress">
                </div>
                <div class="col-md-4">
                    <label for="inputCity" class="form-label">City</label>
                    <input type="text" class="form-control" id="city" name="city">
                </div>
            </div>

            <div class="row mt-2 justify-content-center">
                <div class="col-md-3 ">
                    Upload Aadhaar Card:
                    <br>
                    <input type="file" name="AadhaarPic" id="AadhaarPic" onchange="doShowPrev(this,prev)">
                    <br><br>

                    <img id="prev" src="" width="300" height="400">
                </div>
                <div class="col-md-5">
                    Profile Pic:
                    <br>
                    <input type="file" name="profilePic" id="profilePic" onchange="doShowPrev2(this,prev2)">
                    <br><br>

                    <img id="prev2" src="" width="300" height="400">
                </div>
            </div>
            <div class="row mt-1 g-5">
                <div class="col-md-12">
                    <center> <button type="submit" class="btn btn-primary">Send to server</button>
                        <button type="submit" class="btn btn-primary" formaction="/update-record">Modify my
                            profile</button>
                    </center>
                </div>
            </div>
        </form>
    </div>
</body>

</html>
