<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>


    <script src="https://cdnjs.cloudflare.com/ajax/libs/angular.js/1.8.3/angular.min.js"></script>

    <script>
        let myModule = angular.module("moduleKuch", []);
        let myController = myModule.controller("controllerKuch", function ($scope, $http) {
            $scope.doShowAllmedDetails = function () {
                let url = "/fetch-all-med-details";
                $http.get(url).then(function (resp) {
                    //alert(JSON.stringify(resp.data));
                    $scope.jsonAry = resp.data;
                }, function (err) {
                    alert(err);

                })
            }

            $scope.doShowallmedDetailsinmodel=function(obj){
                $scope.ObjOne=obj;
            }
        })
    </script>
</head>

<body ng-app="moduleKuch" ng-controller="controllerKuch" ng-init="doShowAllmedDetails()">
    <center>
            <h2>MEDICINE RECORDS</h2>
            </center>
    <hr>
     <div class="container">
            <div class="row g-3">
                <div class="col-md-3 border border-danger" ng-repeat="obj in jsonAry">
                    <div class="card g-5">
                        <img src="{{obj.picurl}}" class="card-img-top" alt="..." width="100">
                        <div class="card-body">
                            <h5 class="card-title">{{obj.emailid}}</h5>
                            <p class="card-text">
                                {{obj.medname}}
                            </p>
                            <p class="card-text">
                                {{obj.company}}
                            </p>
                            <p class="card-text">
                                {{obj.packing}}
                            </p>
                            <a href="#" class="btn btn-primary" ng-click="doShowallmedDetailsinmodel(obj)" data-bs-toggle="modal"
                                data-bs-target="#allmeddetailsmodel">Details</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!--ALL MEDICINE DETAILS IN MODEL IN TABLE-->
            <div class="modal fade" id="allmeddetailsmodel" tabindex="-1" aria-labelledby="exampleModalLabel"
                aria-hidden="true">
                <div class="modal-dialog modal-xl">
                    <div class="modal-content">
                        <div class="modal-header bg-warning">
                            <h1 class="modal-title fs-5" id="exampleModalLabel">Medicine Details</h1>
                            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                        </div>
                        <div class="modal-body">
                            <form>
                                
                                    <div class="row mt-4">
                                        <table border="1">
                                            <tr>

                                                <th>Medicine</th>
                                                <th>Expiry Date</th>
                                                <th>Company</th>
                                                <th>Type</th>
                                                <th>Qty</th>
                                                <th>Extra info</th>
                                                <th>Pic</th>

                                            </tr>
                                            <tr>

                                                <td>{{ObjOne.medname}}</td>
                                                <td>{{ObjOne.expdate}}</td>
                                                 <td>{{ObjOne.company}}</td>
                                                <td>{{ObjOne.packing}}</td>
                                                <td>{{ObjOne.qty}}</td>
                                                <td>{{ObjOne.info}}</td>
                                                <td>
                                                    <center>
                                                        <img src={{ObjOne.picurl}} width="100" height="100">
                                                    </center>
                                                </td>
                                               
                                            </tr>
                                        </table>
                                    </div>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
</body>
