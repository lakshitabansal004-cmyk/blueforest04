<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/angular.js/1.8.3/angular.min.js"></script>

    <script>
        let myModule = angular.module("moduleKuch", []);
        let myController = myModule.controller("controllerKuch", function ($scope, $http) {
            $scope.doShowAll = function () {
                let url = "/fetch-all-users";
                $http.get(url).then(function (resp) {
                    //alert(JSON.stringify(resp.data));
                    $scope.jsonAry = resp.data;
                }, function (err) {
                    alert(err);

                })
            }

            $scope.doblock = function (emailidKuch) {
                alert(emailidKuch);
                let url = "/block-user?emailkeykuch=" + emailidKuch;
                $http.get(url).then(function (resp) {
                    alert(JSON.stringify(resp.data))
                    $scope.doShowAll();
                }, function (err) {
                    alert(err);
                })
            }

        $scope.doresume = function (emailidKuch) {
                alert(emailidKuch);
                let url = "/resume-user?emailkeykuch=" + emailidKuch;
                $http.get(url).then(function (resp) {
                    alert(JSON.stringify(resp.data))
                    $scope.doShowAll();
                }, function (err) {
                    alert(err);
                })
            }
        })
    </script>
</head>

<body ng-app="moduleKuch" ng-controller="controllerKuch" ng-init="doShowAll();">

    <div class="container border">
        <div class="row">
            <div class="col-md-12 bg-warning text-white">
                <center>
                    <b>
                        <p class="fs-2">USERS CONTROL PANEL</p>
                </center>
            </div>
        </div>
        <div class="row mt-4">
            <table class="table table-bordered">
                <tr>
                    <th>Sr. no</th>
                    <th>Emailid</th>
                    <th>Password</th>
                    <th>User type</th>
                    <th>Date of signup</th>
                    <th>Status</th>
                </tr>
                <tr ng-repeat="obj in jsonAry">
                    <td>{{$index}}</td>
                    <td>{{obj.emailid}}</td>
                    <td>{{obj.password}}</td>
                    <td>{{obj.usertype}}</td>
                    <td>{{obj.dos}}</td>
                    <td>{{obj.stataus}}</td>
                    <td>
                        <center>
                            <input type="button" value="Block" class="btn btn-danger"  ng-disabled="obj.stataus==0" ng-click="doblock(obj.emailid);">
                        </center>
                    </td>
                     <td>
                        <center>
                            <input type="button" value="Resume" class="btn btn-success"  ng-disabled="obj.stataus==1" ng-click="doresume(obj.emailid);">
                        </center>
                    </td>
                </tr>
            </table>
        </div>
    </div>
</body>

</html>
