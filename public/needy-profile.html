<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Needy profile</title>
    <script>
        function doShowPrev(fileCtrl, prev) {
            if (fileCtrl.files && fileCtrl.files[0]) {
                prev.src = URL.createObjectURL(fileCtrl.files[0]);

            }
        }
        function doShowPrev2(fileCtrl, prev2) {
            if (fileCtrl.files && fileCtrl.files[0]) {
                prev2.src = URL.createObjectURL(fileCtrl.files[0]);

            }
        }
    </script>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"
        integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo=" crossorigin="anonymous"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>

<body>

    <div class="container border">
        <div class="row">
            <div class="col-md-12 bg-warning text-white">
                <center>
                    <b>
                        <p class="fs-2">NEEDY PROFILE</p>
                </center>
            </div>
        </div>
        <form action="/neddy-prof" class="" enctype="multipart/form-data" method="post">
            <div class="row mt-3">
                <div class="col-md-4">
                    <label for="inputEmail4" class="form-label">Email Id</label>
                    <input type="email" class="form-control" id="txtEmail" name="txtEmail">
                </div>
                <div class="col-md-5">
                    <label for="inputEmail4" class="form-label">Mobile Number</label>
                    <input type="text" class="form-control" id="num" name="num">
                </div>
            </div>

            <div class="row mt-4 justify-content-center">
                <div class="col-md-5 ">
                    Adhaar Card Front Pic:
                    <br>
                    <br>
                        <img id="prev" src="" width="300" height="400">
                        <br>
                        <br>
                        <input type="file" name="pic1url" id="pic1url"  onchange="doShowPrev(this,prev)">

                </div>
                <div class="col-md-5">
                    Adhaar Card Rear Pic:
                    <br>
                    <br>
                        <img id="prev2" src="" width="300" height="400">
                        <br>
                        <br>
                        <input type="file" name="pic2url" id="pic2url"  onchange="doShowPrev(this,prev2)">

                </div>
            </div>
            <div class="row mt-1 g-5">
                <div class="col-md-12">
                    <center> <button type="submit" class="btn btn-primary">Upload Details</button>

                </div>
            </div>
        </form>
    </div>
</body>

</html>
