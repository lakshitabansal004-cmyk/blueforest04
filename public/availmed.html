<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Available medicine</title>
    <script>
        function doShowPrev(fileCtrl, prev) {
            if (fileCtrl.files && fileCtrl.files[0]) {
                prev.src = URL.createObjectURL(fileCtrl.files[0]);

            }
        }
    </script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>

<body>

    <div class="container border">
         <div class="row" style="background-color: rgb(0, 184, 80);">
        <div class="col-md-12  text-white">
                <center >
               <b>
             <p class="fs-2">Avail Medicine</p>
               </center>
            </div>
            </div>
         <form action="/availmed" class=""  enctype="multipart/form-data" method="post">
    <div class="d-flex">

        <!-- Left Div -->
        <div style="width:500px; height:600px;">
            <center>
                <img id="prev" src="" width="300" height="400" style="margin-top:80px;">
                <br><br>
               <b>Medicine Image:</b> 
                <input type="file" name="picurl" id="picurl"  onchange="doShowPrev(this,prev)">
            </center>
        </div>

        <!-- Right Div -->
        <div class="container border">
        <div class="row ">
            
        </div>
       
            <div class="row g-3 align-items-end">
                <div class="col-md-6 mt-5">
                    <label for="inputEmail4" class="form-label">Email</label>
                    <input type="email" class="form-control" id="txtEmail2" name="txtEmail2">
                </div>
                </div>
 <div class="row mt-4">
                <div class="col-md-4">
                    <label for="inputAddress" class="form-label">Med.Name</label>
                    <input type="text" class="form-control" id="txtmedName" name="txtmedName" >
                </div>
                <div class="col-md-4">
                    <label for="inputCity" class="form-label">Exp.Date</label>
                    <br>
                    <input type="date" name="expdate" id="expdate">
                </div>
                <div class="col-md-4">
                    <label for="inputAddress" class="form-label">Company</label>
                    <input type="text" class="form-control" id="company" name="company">
                </div>
 </div>
 <div class="row mt-3">
                <div class="col-md-4">
                    <label for="inputCity" class="form-label">Packing</label>
                    <select name="Packing" id="Packing">
                    <option value="none">Select</option>
                    <option value="Tablets">Tablets</option>
                    <option value="Sachet">Sachet</option>
                    <option value="Syrup">Syrup</option>
                    <option value="Ointment">Ointment</option>
                </select>
                </div>
                <div class="col-md-4">
                <label for="inputCity" class="form-label">Qty</label>
                    <input type="number" max="1000" min="0" value="0" id="Qty" name="Qty">
                </div>
                <div class="col-md-4">
                    <label for="inputAddress" class="form-label">Other info</label>
                    <input type="text" class="form-control" id="info" name="info">
                </div>
               </div>
                 
             
            <div class="row mt-1 g-5">
                <div class="col-md-12">
                   <center> <button type="submit" class="btn btn-primary">Avail Medicine</button>
                    
                </div>
            </div>
        </form>
    </div>
</body>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
  </body>
</html>

</div>

</body>

</html>
